<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <!-- The app ships its own dark theme; declaring color-scheme opts the page out of
         mobile browsers' "auto/force dark" re-coloring, which muddies the accent colours. -->
    <meta name="color-scheme" content="dark" />
    <!-- PWA: address-bar / status-bar tint and iOS home-screen behaviour.
         The manifest link and service-worker registration are injected by
         vite-plugin-pwa at build time. -->
    <meta name="theme-color" content="#0f1115" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tichu" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Tichu</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
