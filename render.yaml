# Render blueprint — single service that builds the web client and serves it
# alongside the Socket.IO game server (same origin, no CORS, one URL).
#
# Deploy: push this repo to GitHub, then on render.com → "New" → "Blueprint"
# and pick the repo. Render reads PORT automatically; the server uses it.
services:
  - type: web
    name: tichu
    runtime: node
    plan: free
    # --include=dev so Vite (a devDependency) is available to build the client.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '20'
      # Expert (용용봇/PIMC) bot tuning. Keep WORKERS at 1 on a shared-CPU plan;
      # lower BUDGET_MS for faster (but weaker) expert moves. See server/src/pimc.ts.
      - key: PIMC_WORKERS
        value: '1'
      - key: PIMC_BUDGET_MS
        value: '500'
      # Optional: Discord/Slack webhook for the head-pat feed. Value is set in the
      # Render dashboard (sync: false → kept out of git, survives blueprint syncs).
      - key: DISCORD_WEBHOOK_URL
        sync: false
      # Optional: SEPARATE Discord webhook for user feedback (bug reports/suggestions),
      # kept apart from the head-pat feed. Set in the dashboard (sync: false).
      - key: DISCORD_FEEDBACK_WEBHOOK_URL
        sync: false
